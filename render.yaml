services:
  - type: web
    name: contingent-app
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL        # Neon connection string (sslmode=require)
        sync: false
      - key: ADMIN_PASSWORD      # நாளிதழ் Admin உள்நுழைவுக்கு
        sync: false
      - key: SECRET_KEY
        generateValue: true
