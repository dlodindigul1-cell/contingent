<!doctype html><html lang="ta"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>நூலக வரவினங்கள்</title><style>body{font-family:Arial,'Noto Sans Tamil',sans-serif;background:#f4f6fa;color:#17243a}.wrap{max-width:850px;margin:24px auto;padding:18px}.card{background:white;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block}input,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px}button{padding:10px 16px;background:#174a78;color:white;border:0;border-radius:6px}table{width:100%}td{padding:8px;border-bottom:1px solid #ddd}</style><div class="wrap"><h1>நூலக வரவினங்கள்</h1><p><a href="/">← முகப்பு</a> | <a href="/logout">வெளியேறு</a></p><div class="card"><div class="grid"><label>நூலகம்<select id="lib"></select></label><label>வரவு மாதம் (MM/YYYY)<input id="month" placeholder="06/2026"></label></div><button onclick="findTx()">கிடைக்கும் UPI எண்களைக் காட்டு</button><div id="tx"></div></div><div class="card"><h2>தொகைப் பிரிவு</h2><div class="grid"><label>காப்புத் தொகை<input id="security" type="number" min="0" step="0.01" value="0"></label><label>ஆண்டுச் சந்தா<input id="annual" type="number" min="0" step="0.01" value="0"></label><label>பழைய நாளிதழ் விற்பனை<input id="newspaper" type="number" min="0" step="0.01" value="0"></label></div><button onclick="submitReceipt()">பதிவைச் சேமி</button><p id="msg"></p></div></div><script>
async function api(url,opt={}){let r=await fetch(url,opt),j=await r.json();if(!r.ok||j.success===false)throw Error(j.message||'பிழை');return j}
(async()=>{try{let j=await api('/receipts/libraries');document.querySelector('#lib').innerHTML=j.rows.map(x=>`<option>${x.name}</option>`).join('')}catch(e){alert(e.message)}})();
async function findTx(){try{let m=document.querySelector('#month').value,j=await api('/receipts/available?month='+encodeURIComponent(m));document.querySelector('#tx').innerHTML=j.rows.length?'<table>'+j.rows.map(x=>`<tr><td><input type="checkbox" value="${x.id}" data-amt="${x.amount}" checked></td><td>${x.transaction_date}</td><td>${x.upi_number}</td><td>₹${x.amount}</td></tr>`).join('')+'</table>':'இந்த மாதத்திற்கு கிடைக்கும் UPI பரிவர்த்தனைகள் இல்லை.'}catch(e){alert(e.message)}}
async function submitReceipt(){let ids=[...document.querySelectorAll('#tx input:checked')].map(x=>+x.value);let body={library:document.querySelector('#lib').value,month:document.querySelector('#month').value,transaction_ids:ids,security:document.querySelector('#security').value,annual:document.querySelector('#annual').value,newspaper:document.querySelector('#newspaper').value};try{let j=await api('/receipts/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.querySelector('#msg').textContent=j.message;findTx()}catch(e){alert(e.message)}}
</script></html>
