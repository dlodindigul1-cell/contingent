<!doctype html><html lang="ta"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>நூலக வரவின மேலாண்மை</title><style>body{font-family:Arial,'Noto Sans Tamil',sans-serif;background:#f4f6fa;margin:0;color:#17243a}.wrap{max-width:1050px;margin:24px auto;padding:18px}.card{background:white;border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}button{padding:9px 14px;background:#174a78;color:white;border:0;border-radius:6px;cursor:pointer}input{padding:9px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#667}</style><div class="wrap"><h1>நூலக வரவின மேலாண்மை — Admin</h1><p><a href="/admin">← பழைய Admin முகப்பு</a> | <a href="/logout">வெளியேறு</a></p><section class="card"><h2>வங்கி பாஸ்புத்தகம் பதிவேற்றுதல்</h2><p>PDF கடவுச்சொல்: EKQ002866. பதிவேற்றும் மாதத்திற்கு முந்தைய மாதம் கணக்கில் எடுத்துக்கொள்ளப்படும்.</p><input id="pdf" type="file" accept="application/pdf"><button onclick="upload()">PDF ஏற்று</button><p id="msg"></p></section><section class="card"><h2>நூலகர் நிலுவைப் பதிவுகள்</h2><button onclick="loadPending()">புதுப்பி</button><div id="pending"></div></section><section class="card"><h2>UPI பரிவர்த்தனைகள்</h2><button onclick="loadTx()">புதுப்பி</button><div id="tx"></div></section></div><script>
async function api(url,opt={}){let r=await fetch(url,opt),j=await r.json();if(!r.ok||j.success===false)throw Error(j.message||'பிழை');return j}
async function upload(){let f=document.querySelector('#pdf').files[0];if(!f)return alert('PDF தேர்வு செய்யவும்');let d=new FormData();d.append('statement',f);try{let j=await api('/receipts/admin/upload',{method:'POST',body:d});document.querySelector('#msg').textContent=j.message+' (கண்டறிந்தவை: '+j.inserted+')';loadTx()}catch(e){alert(e.message)}}
async function loadPending(){try{let j=await api('/receipts/admin/pending');document.querySelector('#pending').innerHTML='<table><tr><th>நூலகம்</th><th>மாதம்</th><th>இனங்கள் மொத்தம்</th><th>UPI விவரம்</th><th>செயல்</th></tr>'+j.rows.map(x=>`<tr><td>${x.library_name}</td><td>${x.month_year}</td><td>₹${x.total_amount}</td><td>${(x.transactions||[]).map(t=>t.upi+' — ₹'+t.amount).join('<br>')}</td><td>${x.status==='pending'?`<button onclick="approve(${x.id})">ஒப்புதல்</button>`: 'ஒப்புதல் வழங்கப்பட்டது'}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}
async function approve(id){if(!confirm('இந்த மாத வரவினத்தை இறுதியாக ஒப்புதல் அளிக்கவா?'))return;try{await api('/receipts/admin/approve/'+id,{method:'POST'});loadPending();loadTx()}catch(e){alert(e.message)}}
async function loadTx(){try{let j=await api('/receipts/admin/transactions');document.querySelector('#tx').innerHTML='<table><tr><th>தேதி</th><th>UPI எண்</th><th>தொகை</th><th>நூலகம்</th><th>நிலை</th><th>Admin செயல்</th></tr>'+j.rows.map(x=>`<tr><td>${x.transaction_date}</td><td>${x.upi_number}</td><td>₹${x.amount}</td><td>${x.library_name||'—'}</td><td>${x.status}</td><td>${x.status!=='used'?`<button onclick="releaseTx(${x.id})">நீக்கி Lock விடுவி</button>`:'இறுதி'}</td></tr>`).join('')+'</table>'}catch(e){alert(e.message)}}
async function releaseTx(id){let reason=prompt('நீக்குவதற்கான காரணம்:');if(!reason)return;try{await api('/receipts/admin/delete-transaction/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});loadTx();loadPending()}catch(e){alert(e.message)}}loadPending();loadTx();</script></html>
